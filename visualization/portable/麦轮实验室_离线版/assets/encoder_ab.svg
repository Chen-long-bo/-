<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380" font-family="Microsoft YaHei, SimHei, Arial, sans-serif"><defs><marker id="arrow00D1B2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#00D1B2"/></marker><marker id="arrow4F8CFF" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4F8CFF"/></marker><marker id="arrowFF5C6C" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#FF5C6C"/></marker><marker id="arrowFFC857" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#FFC857"/></marker><marker id="arrow8A8F9E" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#8A8F9E"/></marker></defs><rect width="800" height="380" fill="#0E0F13"/><text x="30" y="32" fill="#ffffff" font-size="20" text-anchor="start" font-weight="bold">霍尔编码器 A/B 相与 4 倍频</text><text x="30" y="80" fill="#E6E8EF" font-size="13" text-anchor="start" font-weight="normal">A 相</text><text x="30" y="140" fill="#E6E8EF" font-size="13" text-anchor="start" font-weight="normal">B 相</text><polyline points="100,62 120,80 140,62 160,80 180,62 200,80 220,62 240,80 260,62 280,80 300,62 320,80 340,62 360,80 380,62 400,80 420,62 440,80 460,62 480,80 500,62 520,80 540,62 560,80 580,62 600,80 620,62 640,80 660,62 680,80 700,62 720,80 740,62 760,80 780,62 800,80 820,62 840,80 860,62 880,80" fill="none" stroke="#00D1B2" stroke-width="2"/><polyline points="100,140 120,122 140,140 160,122 180,140 200,122 220,140 240,122 260,140 280,122 300,140 320,122 340,140 360,122 380,140 400,122 420,140 440,122 460,140 480,122 500,140 520,122 540,140 560,122 580,140 600,122 620,140 640,122 660,140 680,122 700,140 720,122 740,140 760,122 780,140 800,122 820,140 840,122 860,140 880,122" fill="none" stroke="#4F8CFF" stroke-width="2"/><text x="30" y="220" fill="#8A8F9E" font-size="13" text-anchor="start" font-weight="normal">A、B 相差 90°；正交解码可得到方向 + 计数。</text><text x="30" y="250" fill="#00D1B2" font-size="14" text-anchor="start" font-weight="normal">每转计数 CPR = 编码器线数 × 减速比 × 倍频数</text><text x="30" y="278" fill="#00D1B2" font-size="14" text-anchor="start" font-weight="normal">当前假设：11PPR × 56 × 4 = 2464 counts/输出转</text><text x="30" y="320" fill="#FFC857" font-size="13" text-anchor="start" font-weight="normal">如果实际 CPR 不同：用测试工程 enczero → 走已知距离 → cpcal &lt;mm&gt; 反算。</text></svg>