"300" width="50" height="90" rx="8" fill="#1B1D25" stroke="#FFC857" stroke-width="2"/><text x="785" y="345" fill="#FFC857" font-size="16" text-anchor="middle" font-weight="bold">D</text><text x="300" y="245" fill="#8A8F9E" font-size="12" text-anchor="start" font-weight="normal">A 左前</text><text x="760" y="245" fill="#8A8F9E" font-size="12" text-anchor="start" font-weight="normal">B 右前</text><text x="300" y="415" fill="#8A8F9E" font-size="12" text-anchor="start" font-weight="normal">C 左后</text><text x="760" y="415" fill="#8A8F9E" font-size="12" text-anchor="start" font-weight="normal">D 右后</text><line x1="540" y1="240" x2="640" y2="240" stroke="#4F8CFF" stroke-width="2" marker-end="url(#arrow4F8CFF)"/><text x="590.0" y="234.0" fill="#4F8CFF" font-size="11" text-anchor="start" font-weight="normal">vx 前进</text><line x1="540" y1="240" x2="540" y2="160" stroke="#4F8CFF" stroke-width="2" marker-end="url(#arrow4F8CFF)"/><text x="540.0" y="194.0" fill="#4F8CFF" font-size="11" text-anchor="start" font-weight="normal">vy 左</text><path d="M 520 260 A 45 45 0 0 1 560 260" fill="none" stroke="#FFC857" stroke-width="2"/><text x="565" y="275" fill="#FFC857" font-size="11" text-anchor="start" font-weight="normal">wz 逆时针+</text><text x="30" y="470" fill="#ffffff" font-size="15" text-anchor="start" font-weight="bold">逆运动学（轮子线速度，m/s）：</text><text x="30" y="500" fill="#00D1B2" font-size="14" text-anchor="start" font-weight="normal">A = vx - vy - (a+b)·wz</text><text x="30" y="525" fill="#00D1B2" font-size="14" text-anchor="start" font-weight="normal">B = vx + vy + (a+b)·wz</text><text x="30" y="550" fill="#00D1B2" font-size="14" text-anchor="start" font-weight="normal">C = vx + vy - (a+b)·wz</text><text x="30" y="575" fill="#00D1B2" font-size="14" text-anchor="start" font-weight="normal">D = vx - vy + (a+b)·wz</text><text x="600" y="500" fill="#8A8F9E" font-size="13" text-anchor="start" font-weight="normal">a = 轴距/2，b = 轮距/2</text><text x="600" y="525" fill="#8A8F9E" font-size="13" tex