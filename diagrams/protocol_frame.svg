<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Microsoft YaHei, SimHei, Arial, sans-serif"><defs><marker id="arrow00D1B2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#00D1B2"/></marker><marker id="arrow4F8CFF" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4F8CFF"/></marker><marker id="arrowFF5C6C" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#FF5C6C"/></marker><marker id="arrowFFC857" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#FFC857"/></marker><marker id="arrow8A8F9E" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#8A8F9E"/></marker></defs><rect width="900" height="400" fill="#0E0F13"/><text x="30" y="32" fill="#ffffff" font-size="20" text-anchor="start" font-weight="bold">通信协议帧格式（AA 55 LEN CMD DATA CHECK）</text><rect x="30" y="90" width="60" height="60" rx="6" fill="#1B1D25" stroke="#00D1B2" stroke-width="2"/><text x="60.0" y="127" fill="#ffffff" font-size="14" text-anchor="middle" font-weight="bold">AA</text><rect x="98" y="90" width="60" height="60" rx="6" fill="#1B1D25" stroke="#00D1B2" stroke-width="2"/><text x="128.0" y="127" fill="#ffffff" font-size="14" text-anchor="middle" font-weight="bold">55</text><rect x="166" y="90" width="70" height="60" rx="6" fill="#1B1D25" stroke="#00D1B2" stroke-width="2"/><text x="201.0" y="127" fill="#ffffff" font-size="14" text-anchor="middle" font-weight="bold">LEN</text><rect x="244" y="90" width="70" height="60" rx="6" fill="#1B1D25" stroke="#00D1B2" stroke-width="2"/><text x="279.0" y="127" fill="#ffffff" font-size="14" text-anchor="middle" font-weight="bold">CMD</text><rect x="322" y="90" width="260" height="60" rx="6" fill="#1B1D25" stroke="#00D1B2" stroke-width="2"/><text x="452.0" y="127" fill="#ffffff" font-size="14" text-anchor="middle" font-weight="bold">DATA ...</text><rect x="590" y="90" width="80" height="60" rx="6" fill="#1B1D25" stroke="#00D1B2" stroke-width="2"/><text x="630.0" y="127" fill="#ffffff" font-size="14" text-anchor="middle" font-weight="bold">CHECK</text><text x="30" y="190" fill="#00D1B2" font-size="14" text-anchor="start" font-weight="normal">LEN = CMD + DATA 的字节数；CHECK = (LEN + CMD + DATA 所有字节之和) &amp; 0xFF</text><text x="30" y="225" fill="#E6E8EF" font-size="14" text-anchor="start" font-weight="normal">例：心跳帧 AA 55 01 0A 0B</text><text x="30" y="250" fill="#8A8F9E" font-size="13" text-anchor="start" font-weight="normal">LEN=01, CMD=0A, CHECK=01+0A=0B</text><text x="30" y="290" fill="#4F8CFF" font-size="13" text-anchor="start" font-weight="normal">PC 端：protocol.build_frame() / FrameParser</text><text x="30" y="315" fill="#00D1B2" font-size="13" text-anchor="start" font-weight="normal">STM32 端：Bluetooth_SendFrame() / Bluetooth_OnRxByte()</text><text x="30" y="355" fill="#FFC857" font-size="13" text-anchor="start" font-weight="normal">注意：两端校验和算法必须完全一致；LEN 也要参与校验。</text></svg>