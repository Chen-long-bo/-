<svg xmlns="http://www.w3.org/2000/svg" width="950" height="550" viewBox="0 0 950 550" font-family="Microsoft YaHei, SimHei, Arial, sans-serif"><defs><marker id="arrow00D1B2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#00D1B2"/></marker><marker id="arrow4F8CFF" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4F8CFF"/></marker><marker id="arrowFF5C6C" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#FF5C6C"/></marker><marker id="arrowFFC857" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#FFC857"/></marker><marker id="arrow8A8F9E" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#8A8F9E"/></marker></defs><rect width="950" height="550" fill="#0E0F13"/><text x="30" y="32" fill="#ffffff" font-size="20" text-anchor="start" font-weight="bold">控制模式状态机</text><ellipse cx="200" cy="120" rx="80" ry="40" fill="#15161C" stroke="#00D1B2" stroke-width="2"/><text x="200" y="125" fill="#ffffff" font-size="15" text-anchor="middle" font-weight="bold">IDLE</text><ellipse cx="500" cy="120" rx="80" ry="40" fill="#15161C" stroke="#00D1B2" stroke-width="2"/><text x="500" y="125" fill="#ffffff" font-size="15" text-anchor="middle" font-weight="bold">MANUAL</text><ellipse cx="800" cy="120" rx="80" ry="40" fill="#15161C" stroke="#00D1B2" stroke-width="2"/><text x="800" y="125" fill="#ffffff" font-size="15" text-anchor="middle" font-weight="bold">BRAKE_SOFT</text><ellipse cx="500" cy="300" rx="80" ry="40" fill="#15161C" stroke="#00D1B2" stroke-width="2"/><text x="500" y="305" fill="#ffffff" font-size="15" text-anchor="middle" font-weight="bold">POS_STOP</text><ellipse cx="800" cy="300" rx="80" ry="40" fill="#15161C" stroke="#00D1B2" stroke-width="2"/><text x="800" y="305" fill="#ffffff" font-size="15" text-anchor="middle" font-weight="bold">ROTATE</text><ellipse cx="200" cy="300" rx="80" ry="40" fill="#15161C" stroke="#00D1B2" stroke-width="2"/><text x="200" y="305" fill="#ffffff" font-size="15" text-anchor="middle" font-weight="bold">ROUTE</text><line x1="200" y1="120" x2="420" y2="120" stroke="#4F8CFF" stroke-width="2" marker-end="url(#arrow4F8CFF)"/><text x="310.0" y="114.0" fill="#4F8CFF" font-size="11" text-anchor="start" font-weight="normal">0x01 手动</text><line x1="500" y1="120" x2="720" y2="120" stroke="#FFC857" stroke-width="2" marker-end="url(#arrowFFC857)"/><text x="610.0" y="114.0" fill="#FFC857" font-size="11" text-anchor="start" font-weight="normal">0x03 缓停</text><line x1="500" y1="120" x2="500" y2="260" stroke="#00D1B2" stroke-width="2" marker-end="url(#arrow00D1B2)"/><text x="500.0" y="184.0" fill="#00D1B2" font-size="11" text-anchor="start" font-weight="normal">0x04 PID停</text><line x1="800" y1="120" x2="800" y2="260" stroke="#FFC857" stroke-width="2" marker-end="url(#arrowFFC857)"/><text x="800.0" y="184.0" fill="#FFC857" font-size="11" text-anchor="start" font-weight="normal">0x0D 旋转</text><line x1="200" y1="120" x2="200" y2="260" stroke="#00D1B2" stroke-width="2" marker-end="url(#arrow00D1B2)"/><text x="200.0" y="184.0" fill="#00D1B2" font-size="11" text-anchor="start" font-weight="normal">0x05 路线</text><line x1="720" y1="300" x2="500" y2="300" stroke="#8A8F9E" stroke-width="2" marker-end="url(#arrow8A8F9E)"/><text x="610.0" y="294.0" fill="#8A8F9E" font-size="11" text-anchor="start" font-weight="normal">完成/停止</text><line x1="500" y1="300" x2="200" y2="300" stroke="#8A8F9E" stroke-width="2" marker-end="url(#arrow8A8F9E)"/><text x="30" y="420" fill="#FF5C6C" font-size="13" text-anchor="start" font-weight="normal">0x02 急刹 / 0x06 急停：任何状态 → IDLE（立即停车）</text><text x="30" y="450" fill="#8A8F9E" font-size="13" text-anchor="start" font-weight="normal">0x01 手动：IDLE/其它 → MANUAL</text><text x="30" y="480" fill="#8A8F9E" font-size="13" text-anchor="start" font-weight="normal">0x03 缓停：MANUAL → BRAKE_SOFT → IDLE</text><text x="30" y="510" fill="#8A8F9E" font-size="13" text-anchor="start" font-weight="normal">0x04 PID停：进入位置环；0x0D 旋转：定时旋转后回 IDLE</text></svg>